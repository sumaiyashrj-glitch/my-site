<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>গেম জোন</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}
/* মেনু */
#menu{max-width:520px;margin:0 auto;padding:30px 18px;text-align:center}
#menu h1{font-size:2.2rem;margin-bottom:6px}
#menu p{opacity:.7;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gc{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:20px;padding:22px 10px;color:#fff;transition:.2s}
.gc:hover,.gc:active{transform:translateY(-4px) scale(1.03);background:rgba(255,255,255,.16)}
.gc .e{font-size:3rem;display:block;margin-bottom:8px}
.gc b{display:block;font-size:1.05rem}.gc small{opacity:.65}
/* গেম */
#game{position:fixed;inset:0;background:#111;touch-action:none}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}
#back{position:absolute;top:40px;left:12px;background:rgba(0,0,0,.5);color:#fff;padding:7px 14px;border-radius:16px;font-size:.9rem}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,30,.9);text-align:center;padding:20px;z-index:5}
.ov h1{font-size:2.2rem;margin-bottom:10px}.ov p{opacity:.85;line-height:1.7}
.big{margin-top:18px;padding:13px 36px;font-size:1.1rem;font-weight:bold;border-radius:28px;background:linear-gradient(135deg,#fd79a8,#fdcb6e);color:#2d3436}
.big.alt{background:rgba(255,255,255,.15);color:#fff;margin-top:10px}
/* মেমরি */
#mem{position:fixed;inset:0;background:linear-gradient(135deg,#0f0c29,#302b63);padding:20px;overflow:auto;text-align:center}
#mem h2{margin:10px 0}
#mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:16px auto}
.mc{aspect-ratio:1;border-radius:14px;background:#6c5ce7;font-size:2rem;color:transparent;display:flex;align-items:center;justify-content:center;transition:.3s}
.mc.open{background:#fff;color:#000;transform:rotateY(0)}
.mc.done{background:#00b894;color:#000}
</style>
</head>
<body>

<div id="menu">
  <h1>🎮 গেম জোন</h1>
  <p>একটি গেম বেছে নিন</p>
  <div class="grid">
    <button class="gc" onclick="launch('zombie')"><span class="e">🧟</span><b>জোম্বি সারভাইভাল</b><small>ঢেউয়ের পর ঢেউ</small></button>
    <button class="gc" onclick="launch('br')"><span class="e">🪂</span><b>ব্যাটল রয়্যাল</b><small>২০ জন, ১ বিজয়ী</small></button>
    <button class="gc" onclick="launch('snake')"><span class="e">🐍</span><b>স্নেক</b><small>খাও আর বড় হও</small></button>
    <button class="gc" onclick="openMem()"><span class="e">🧠</span><b>মেমরি ম্যাচ</b><small>জোড়া মেলাও</small></button>
  </div>
</div>

<!-- অ্যাকশন গেম স্ক্রিন -->
<div id="game" class="hidden">
  <canvas id="cv"></canvas>
  <div id="hud"><span id="h1"></span><span id="h2"></span></div>
  <button id="back" onclick="quit()">⬅ মেনু</button>
  <div id="ov" class="ov hidden"></div>
</div>

<!-- মেমরি গেম -->
<div id="mem" class="hidden">
  <button id="back2" class="big alt" style="margin:0" onclick="closeMem()">⬅ মেনু</button>
  <h2>🧠 মেমরি ম্যাচ</h2>
  <div id="minfo">চাল: 0</div>
  <div id="mgrid"></div>
  <button class="big" onclick="openMem()">নতুন খেলা</button>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W, H;
function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);

const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hiGet = k => { try { return +localStorage.getItem(k) || 0 } catch { return 0 } };
const hiSet = (k, v) => { try { localStorage.setItem(k, v) } catch {} };

/* ===== ইনপুট (জয়স্টিক + কিবোর্ড) ===== */
const joy = {on: false, ox: 0, oy: 0, x: 0, y: 0};
const keys = {};
let ptrId = null;
cv.addEventListener('pointerdown', e => { joy.on = true; ptrId = e.pointerId; joy.ox = joy.cx = e.clientX; joy.oy = joy.cy = e.clientY; joy.x = joy.y = 0; });
cv.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== ptrId) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const l = Math.hypot(dx, dy), m = 55;
  if (l > m) { dx = dx / l * m; dy = dy / l * m; }
  joy.cx = joy.ox + dx; joy.cy = joy.oy + dy; joy.x = dx / m; joy.y = dy / m;
});
const endJoy = () => { joy.on = false; joy.x = joy.y = 0; };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function inputVec() {
  let x = joy.x, y = joy.y;
  if (keys.a || keys.arrowleft) x -= 1; if (keys.d || keys.arrowright) x += 1;
  if (keys.w || keys.arrowup) y -= 1; if (keys.s || keys.arrowdown) y += 1;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  return {x, y};
}
function drawJoy() {
  if (!joy.on) return;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 55, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.arc(joy.cx, joy.cy, 24, 0, 7); ctx.fill();
}

/* ===== গেম ম্যানেজার ===== */
let cur = null, running = false, last = 0;
function launch(name) {
  $('menu').classList.add('hidden'); $('game').classList.remove('hidden');
  resize(); cur = G[name];
  showOv(`<h1>${cur.title}</h1><p>${cur.help}</p><button class="big" onclick="begin()">শুরু করুন</button>`);
}
function begin() {
  $('ov').classList.add('hidden');
  cur.init(); running = true; last = performance.now();
  requestAnimationFrame(loop);
}
function showOv(html) { $('ov').innerHTML = html; $('ov').classList.remove('hidden'); }
function end(msg) {
  running = false;
  showOv(`${msg}<button class="big" onclick="begin()">আবার খেলুন</button><button class="big alt" onclick="quit()">মেনুতে ফিরুন</button>`);
}
function quit() {
  running = false; cur = null;
  $('game').classList.add('hidden'); $('ov').classList.add('hidden'); $('menu').classList.remove('hidden');
}
function loop(t) {
  if (!running) return;
  const dt = Math.min((t - last) / 1000, .05); last = t;
  if (cur.tick) { cur.acc = (cur.acc || 0) + dt; while (cur.acc >= cur.step) { cur.acc -= cur.step; cur.update(); if (!running) return; } }
  else cur.update(dt);
  if (!running) return;
  cur.draw();
  drawJoy();
  requestAnimationFrame(loop);
}

/* ===== সব গেম ===== */
const G = {};

/* ---------- জোম্বি ---------- */
(() => {
  let p, zs, bs, ps, score, kills, spawn, fire, hp;
  G.zombie = {
    title: '🧟 জোম্বি সারভাইভাল',
    help: 'আঙুল টেনে (বা WASD দিয়ে) সরুন।<br>আপনার বন্দুক কাছের জোম্বিকে নিজে নিজে গুলি করে।<br>➕ নিলে প্রাণ বাড়ে। যতক্ষণ পারেন টিকে থাকুন!',
    init() { p = {x: W / 2, y: H / 2}; zs = []; bs = []; ps = []; score = 0; kills = 0; spawn = 0; fire = 0; hp = 100; },
    update(dt) {
      const v = inputVec(); p.x = clamp(p.x + v.x * 190 * dt, 15, W - 15); p.y = clamp(p.y + v.y * 190 * dt, 15, H - 15);
      const wave = 1 + Math.floor(kills / 12);
      spawn -= dt;
      if (spawn <= 0) {
        spawn = Math.max(.3, 1.2 - wave * .1);
        const s = Math.floor(rnd(0, 4));
        const x = s === 0 ? -20 : s === 1 ? W + 20 : rnd(0, W), y = s === 2 ? -20 : s === 3 ? H + 20 : rnd(0, H);
        zs.push({x, y, hp: 2 + Math.floor(wave / 2), sp: Math.min(150, 55 + wave * 9 + rnd(0, 25))});
      }
      fire -= dt;
      let tg = null, bd = 340;
      for (const z of zs) { const d = dist(z, p); if (d < bd) { bd = d; tg = z; } }
      if (tg && fire <= 0) {
        fire = .22; const a = Math.atan2(tg.y - p.y, tg.x - p.x);
        bs.push({x: p.x, y: p.y, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, l: .7});
      }
      for (const b of bs) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; }
      for (const z of zs) {
        const a = Math.atan2(p.y - z.y, p.x - z.x); z.x += Math.cos(a) * z.sp * dt; z.y += Math.sin(a) * z.sp * dt;
        if (dist(z, p) < 26) hp -= 22 * dt;
        for (const b of bs) if (b.l > 0 && dist(z, b) < 18) { b.l = 0; z.hp--; if (z.hp <= 0) { z.dead = 1; kills++; score += 10; if (Math.random() < .1) ps.push({x: z.x, y: z.y}); } }
      }
      zs = zs.filter(z => !z.dead); bs = bs.filter(b => b.l > 0);
      for (const q of ps) if (dist(q, p) < 26) { q.dead = 1; hp = Math.min(100, hp + 25); }
      ps = ps.filter(q => !q.dead);
      $('h1').textContent = `❤️ ${Math.max(0, Math.ceil(hp))}   🌊 ঢেউ ${wave}`;
      $('h2').textContent = `🏆 ${score} (সেরা ${Math.max(score, hiGet('zHi'))})`;
      if (hp <= 0) { if (score > hiGet('zHi')) hiSet('zHi', score); end(`<h1>💀 জোম্বিরা জিতে গেল</h1><p>স্কোর: <b>${score}</b><br>মারা জোম্বি: ${kills}<br>সেরা স্কোর: ${hiGet('zHi')}</p>`); }
    },
    draw() {
      ctx.fillStyle = '#23301f'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '22px serif'; for (const q of ps) ctx.fillText('➕', q.x, q.y);
      ctx.fillStyle = '#ffeaa7'; for (const b of bs) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 7); ctx.fill(); }
      ctx.font = '32px serif'; for (const z of zs) ctx.fillText('🧟', z.x, z.y);
      ctx.font = '34px serif'; ctx.fillText('🧑‍🚀', p.x, p.y);
    }
  };
})();

/* ---------- ব্যাটল রয়্যাল ---------- */
(() => {
  const S = 1800; let es, bs, me, t, cam;
  const alive = () => es.filter(e => e.hp > 0);
  G.br = {
    title: '🪂 ব্যাটল রয়্যাল',
    help: 'আপনি সহ ২০ জন। সরে গিয়ে বাঁচুন, গুলি নিজে নিজে কাছের শত্রুকে লাগে।<br>লাল এলাকা বিপজ্জনক, নিরাপদ বৃত্ত ছোট হচ্ছে!<br>শেষ জন বেঁচে থাকলে আপনিই চ্যাম্পিয়ন।',
    init() {
      es = []; bs = []; t = 0;
      for (let i = 0; i < 20; i++) es.push({x: rnd(150, S - 150), y: rnd(150, S - 150), hp: 100, cd: 0, tx: rnd(0, S), ty: rnd(0, S), tt: 0, me: i === 0, id: i, a: 0});
      me = es[0]; me.x = S / 2 + rnd(-300, 300); me.y = S / 2 + rnd(-300, 300);
    },
    update(dt) {
      t += dt;
      const zr = Math.max(100, 1250 - t * 7), zc = {x: S / 2, y: S / 2};
      for (const e of alive()) {
        let vx = 0, vy = 0, sp = 150;
        if (e.me) { const v = inputVec(); vx = v.x; vy = v.y; sp = 175; }
        else {
          e.tt -= dt;
          if (e.tt <= 0) { e.tx = rnd(0, S); e.ty = rnd(0, S); e.tt = rnd(2, 5); }
          let gx = e.tx, gy = e.ty;
          if (dist(e, zc) > zr - 120) { gx = zc.x; gy = zc.y; }
          const a = Math.atan2(gy - e.y, gx - e.x); vx = Math.cos(a); vy = Math.sin(a); sp = 120;
        }
        e.x = clamp(e.x + vx * sp * dt, 20, S - 20); e.y = clamp(e.y + vy * sp * dt, 20, S - 20);
        if (dist(e, zc) > zr) e.hp -= 5 * dt;
        e.cd -= dt;
        let tg = null, bd = e.me ? 360 : 300;
        for (const o of alive()) if (o !== e) { const d = dist(e, o); if (d < bd) { bd = d; tg = o; } }
        if (tg && e.cd <= 0) {
          e.cd = e.me ? .22 : rnd(.55, .9);
          const a = Math.atan2(tg.y - e.y, tg.x - e.x) + (e.me ? 0 : rnd(-.18, .18)); e.a = a;
          bs.push({x: e.x, y: e.y, vx: Math.cos(a) * 600, vy: Math.sin(a) * 600, l: .65, o: e, d: e.me ? 13 : 8});
        }
      }
      for (const b of bs) {
        b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
        for (const e of es) if (e.hp > 0 && e !== b.o && b.l > 0 && dist(e, b) < 16) { e.hp -= b.d; b.l = 0; if (e.hp <= 0 && b.o.me) b.o.k = (b.o.k || 0) + 1; }
      }
      bs = bs.filter(b => b.l > 0);
      cam = {x: clamp(me.x - W / 2, 0, Math.max(0, S - W)), y: clamp(me.y - H / 2, 0, Math.max(0, S - H))};
      const n = alive().length;
      $('h1').textContent = `❤️ ${Math.max(0, Math.ceil(me.hp))}   🔫 ${me.k || 0}`;
      $('h2').textContent = `👥 জীবিত: ${n}`;
      if (me.hp <= 0) end(`<h1>💀 আপনি আউট!</h1><p>আপনার স্থান: <b>#${n + 1}</b><br>কিল: ${me.k || 0}</p>`);
      else if (n === 1) end(`<h1>🏆 চ্যাম্পিয়ন!</h1><p>আপনিই শেষ জন বেঁচে ছিলেন! 🎉<br>কিল: ${me.k || 0}</p>`);
    },
    draw() {
      ctx.fillStyle = '#3b5d3a'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(-cam.x, -cam.y);
      ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
      for (let i = 0; i <= S; i += 100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, S); ctx.moveTo(0, i); ctx.lineTo(S, i); ctx.stroke(); }
      /* বিপদ এলাকা */
      const zr = Math.max(100, 1250 - t * 7);
      ctx.fillStyle = 'rgba(214,48,49,.35)'; ctx.beginPath(); ctx.rect(-50, -50, S + 100, S + 100); ctx.arc(S / 2, S / 2, zr, 0, 7, true); ctx.fill('evenodd');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(S / 2, S / 2, zr, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#d63031'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, S, S);
      ctx.fillStyle = '#ffeaa7'; for (const b of bs) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 7); ctx.fill(); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const e of alive()) {
        ctx.font = '30px serif'; ctx.fillText(e.me ? '🧑‍🚀' : '🤖', e.x, e.y);
        ctx.fillStyle = '#222'; ctx.fillRect(e.x - 18, e.y - 28, 36, 5);
        ctx.fillStyle = e.me ? '#00cec9' : '#ff7675'; ctx.fillRect(e.x - 18, e.y - 28, 36 * clamp(e.hp / 100, 0, 1), 5);
      }
      ctx.restore();
    }
  };
})();

/* ---------- স্নেক ---------- */
(() => {
  const N = 18; let sn, dir, nd, food, sc, cell, ox, oy;
  G.snake = {
    title: '🐍 স্নেক', help: 'আঙুল টেনে (বা তীর কি দিয়ে) সাপ ঘোরান।<br>🍎 খেলে বড় হবে। দেয়াল বা নিজের শরীরে লাগলে শেষ!',
    tick: true, step: .13,
    init() {
      sn = [{x: 9, y: 9}, {x: 8, y: 9}, {x: 7, y: 9}]; dir = nd = {x: 1, y: 0}; sc = 0; this.acc = 0; this.food();
      cell = Math.floor(Math.min(W - 20, H - 120) / N); ox = (W - cell * N) / 2; oy = (H - cell * N) / 2 + 20;
    },
    food() { do { food = {x: Math.floor(rnd(0, N)), y: Math.floor(rnd(0, N))}; } while (sn.some(s => s.x === food.x && s.y === food.y)); },
    update() {
      const v = inputVec();
      if (Math.hypot(v.x, v.y) > .4) {
        const n = Math.abs(v.x) > Math.abs(v.y) ? {x: Math.sign(v.x), y: 0} : {x: 0, y: Math.sign(v.y)};
        if (n.x !== -dir.x || n.y !== -dir.y) nd = n;
      }
      dir = nd; const h = {x: sn[0].x + dir.x, y: sn[0].y + dir.y};
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || sn.some(s => s.x === h.x && s.y === h.y)) {
        if (sc > hiGet('sHi')) hiSet('sHi', sc);
        return end(`<h1>💥 খেলা শেষ</h1><p>স্কোর: <b>${sc}</b><br>সেরা স্কোর: ${hiGet('sHi')}</p>`);
      }
      sn.unshift(h);
      if (h.x === food.x && h.y === food.y) { sc++; this.food(); } else sn.pop();
      $('h1').textContent = `🍎 ${sc}`; $('h2').textContent = `🏆 ${Math.max(sc, hiGet('sHi'))}`;
    },
    draw() {
      ctx.fillStyle = '#1e272e'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2d3a42'; ctx.fillRect(ox, oy, cell * N, cell * N);
      sn.forEach((s, i) => { ctx.fillStyle = i ? '#55efc4' : '#00b894'; ctx.fillRect(ox + s.x * cell + 1, oy + s.y * cell + 1, cell - 2, cell - 2); });
      ctx.font = cell * .85 + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🍎', ox + food.x * cell + cell / 2, oy + food.y * cell + cell / 2);
    }
  };
})();

/* ===== মেমরি ম্যাচ ===== */
function openMem() {
  $('menu').classList.add('hidden'); $('mem').classList.remove('hidden');
  const em = ['🐶', '🐱', '🦊', '🐼', '🐸', '🦁', '🐵', '🐙'];
  const deck = [...em, ...em].sort(() => Math.random() - .5);
  let first = null, lock = false, moves = 0, found = 0;
  $('minfo').textContent = 'চাল: 0';
  $('mgrid').innerHTML = '';
  deck.forEach(e => {
    const c = document.createElement('div'); c.className = 'mc'; c.textContent = e;
    c.onclick = () => {
      if (lock || c.classList.contains('open') || c.classList.contains('done')) return;
      c.classList.add('open');
      if (!first) { first = c; return; }
      moves++; $('minfo').textContent = 'চাল: ' + moves;
      if (first.textContent === c.textContent) {
        first.classList.replace('open', 'done'); c.classList.replace('open', 'done'); first = null; found++;
        if (found === 8) {
          const best = hiGet('mHi');
          if (!best || moves < best) hiSet('mHi', moves);
          $('minfo').textContent = `🎉 জিতেছেন! ${moves} চালে (সেরা: ${hiGet('mHi')})`;
        }
      } else { lock = true; setTimeout(() => { first.classList.remove('open'); c.classList.remove('open'); first = null; lock = false; }, 700); }
    };
    $('mgrid').appendChild(c);
  });
}
function closeMem() { $('mem').classList.add('hidden'); $('menu').classList.remove('hidden'); }
</script>
